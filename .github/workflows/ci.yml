name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  validate:
    name: Validação do Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar sintaxe do script Bash
        run: |
          if ! bash -n status-check.sh; then
            echo "::error::Erro de sintaxe detectado no status-check.sh"
            exit 1
          else
            echo "::notice::Script válido"
          fi

  test:
    name: Execução dos Testes
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Rodar testes simulados
        run: |
          echo "Running tests"
          echo "::warning::Testes simulados — nenhum teste real foi executado"
          exit 0

  package:
    name: Empacotar e Publicar Artefato
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar artefato de relatório
        run: |
          mkdir -p report
          echo "Relatório gerado em $(date)" > report/summary.txt
          zip -r report.zip report/
          echo "::notice::Arquivo report.zip gerado"

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.zip

      - name: Gerar resumo do job
        run: |
          echo "## CI Summary :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- Sistema operacional: \`$RUNNER_OS\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`$GITHUB_REF_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- Artefato: [report.zip](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
