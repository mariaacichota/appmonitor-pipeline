name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    name: Validação do Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar sintaxe do script Bash
        run: bash -n status-check.sh

  test:
    name: Execução dos Testes
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Rodar testes simulados
        run: |
          echo "Running tests"
          exit 0

  package:
    name: Empacotar e Publicar Artefato
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar artefato de relatório
        run: |
          mkdir -p report
          echo "Relatório gerado em $(date)" > report/summary.txt
          zip -r report.zip report/

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.zip
